<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BharoAI - Sab Form Ek Jagah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-50">
<div class="max-w-6xl mx-auto p-4">
<h1 class="text-3xl font-bold text-center mt-6">BharoAI - Sab Sarkari Form 29 Rs Me</h1>
<p class="text-center text-gray-600 mt-2">Aadhaar Scan Karo, Form Auto-Bharega</p>

<div id="forms" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div>

<div class="bg-white p-6 rounded-xl shadow mt-10">
<h2 class="font-bold text-xl">1. Aadhaar Upload Karo</h2>
<input type="file" id="aadhaar" class="mt-3 border p-2 w-full" accept="image/*">
<button onclick="pay()" class="bg-black text-white w-full mt-4 p-3 rounded-lg font-bold">Pay Rs 29 & Download Form PDF</button>
<p id="status" class="mt-3 text-sm text-center"></p>
</div>
</div>

<script>
fetch('forms.json').then(r=>r.json()).then(data=>{
  let h='';
  data.forEach(f=>{
    h+=`<div class="bg-white p-4 rounded-xl shadow border hover:border-black cursor-pointer">
    <h3 class="font-bold">${f.name}</h3>
    <p class="text-xs text-gray-500 mt-1">Fields: ${f.fields.join(', ')}</p>
    <p class="mt-2 font-bold text-green-600">Rs ${f.price}</p>
    </div>`;
  });
  document.getElementById('forms').innerHTML=h;
});

function pay(){
  var options = {
    "key": "rzp_test_XXXXXXXX", // yaha apni key daal
    "amount": 2900,
    "currency": "INR",
    "name": "BharoAI",
    "description": "Form PDF Download",
    "handler": function (res){ document.getElementById('status').innerText = "Payment Success! ID: "+res.razorpay_payment_id+" - PDF Download Shuru..."; }
  };
  var rzp1 = new Razorpay(options);
  rzp1.open();
}
</script>
</body>
</html>
